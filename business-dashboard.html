t-size:12px;font-weight:800}.eventDot{display:block;margin-top:4px;border-radius:5px;padding:3px 4px;background:#eceeff;color:#4d59b7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.eventDot.reminder{background:#fff0db;color:#956223}.notice{border:1px solid #d8e2fb;background:#edf3ff;color:#465776;border-radius:13px;padding:12px 15px;font-size:13px;margin-bottom:18px;line-height:1.6}.switch{display:flex;gap:12px;align-items:center}.switch input{width:18px;height:18px;accent-color:var(--blue)}.sep{border:0;border-top:1px solid var(--line);margin:18px 0}.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.avatar{width:38px;height:38px;border-radius:12px;background:#e8ecff;display:grid;place-items:center;font-weight:800;color:#6266c9;flex-shrink:0}.memberName{flex:1;min-width:0;font-weight:700;font-size:13px}.memberName small{display:block;font-weight:400;margin-top:4px;overflow-wrap:anywhere}.inviteCode{font:12px ui-monospace,SFMono-Regular,monospace;padding:13px;border:1px dashed #b3bcda;background:#f8faff;border-radius:9px;word-break:break-all}.sectionActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.board .item{align-items:flex-start}.board .card{min-height:280px}.event{display:flex;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.event:last-child{border:0}.event time{font-size:11px;color:var(--muted);display:block;padding-top:4px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#0d1931,#28326e)}.auth .authbox{background:white;border-radius:23px;padding:35px;width:min(100%,440px)}.auth h1{margin:6px 0 8px}.auth p{color:var(--muted);font-size:13px;line-height:1.7}.auth .field input{width:100%}.toast{position:fixed;right:20px;bottom:20px;max-width:min(500px,90vw);background:#192744;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 11px 25px #0003;z-index:99;font-size:13px}.toast.error{background:#a43c52}.toast:empty{display:none}dialog{border:0;border-radius:20px;padding:0;width:min(700px,calc(100vw - 25px));max-height:90dvh;box-shadow:0 25px 75px #121a3566;overflow:auto}dialog::backdrop{background:#0c1739aa}dialog .modalTop{display:flex;align-items:center;justify-content:space-between;padding:20px 25px;border-bottom:1px solid var(--line)}dialog .modalBody{padding:24px 25px}dialog h3{margin:0}.wizardNav{display:flex;gap:8px;margin-bottom:18px}.wizardNav span{flex:1;text-align:center;border-radius:10px;padding:9px;font-size:11px;background:#e8ebf4;color:#768196;font-weight:800}.wizardNav span.on{background:#e1e5ff;color:#565fd9}.kbd{font-size:11px;font-weight:700;padding:3px 5px;border:1px solid #dfe2ed;border-radius:4px}.nav button.mobileOnly{display:none}.mobileMenu{display:none}.fade{color:#abb5c9}.bottomNote{font-size:12px;line-height:1.65;color:#7d8ba2;margin-top:22px}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.dashboardGrid{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{display:block;padding-bottom:75px}.sidebar{position:fixed;left:0;bottom:0;top:auto;width:100%;height:65px;z-index:40;padding:6px 6px;overflow-x:auto;border-top:1px solid #2a4166}.logo,.orgbox,.sidebarFoot{display:none}.nav{display:flex;min-width:0;gap:2px;justify-content:space-around}.nav button{font-size:9px;display:flex;flex-direction:column;gap:2px;min-width:54px;padding:6px 2px}.nav button[data-nav="activity"],.nav button[data-nav="settings"]{display:none}.nav button.mobileOnly{display:flex}.mobileMenu:not(.hidden){display:grid;position:fixed;bottom:71px;right:12px;width:185px;gap:6px;padding:10px;background:#16223f;border:1px solid #435171;border-radius:13px;box-shadow:0 16px 35px #10182d77;z-index:70}.mobileMenu .btn{background:#263656;border:0;color:#fff;text-align:left}.nav .ico{font-size:16px}.topbar{height:68px;p <body><div id="root"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="itemDialog"><div class="modalTop"><h3 id="dialogTitle">Nieuwe taak</h3><button class="btn small ghost" data-action="close-modal" aria-label="Sluiten">✕</button></div><div class="modalBody">
<form id="itemForm"><input type="hidden" name="id"><div class="field"><label for="smartText">Slimme invoer (optioneel)</label><div class="row"><input id="smartText" name="smartText" placeholder="Bijv. herinner me morgen om 09:00 aan overleg" style="width:100%"><button type="button" class="btn" data-action="smart-parse">Begrijp</button></div><small>Werkt lokaal, zonder AI of opslag van je zin. Alleen een expliciet verzoek wordt herinnering.</small></div><div id="wizardNav" class="wizardNav hidden"><span>1 · Soort</span><span>2 · Omschrijving</span><span>3 · Planning</span></div>
<div class="wizardStep" data-step="0"><div class="field"><label>Type</label><select name="kind"><option value="task">Taak (standaard)</option><option value="reminder">Herinnering (expliciet)</option></select></div></div>
<div class="wizardStep" data-step="1"><div class="field"><label>Titel *</label><input required name="title" maxlength="200" placeholder="Wat moet er gebeuren?"></div><div class="field"><label>Extra informatie</label><textarea name="details" maxlength="5000" placeholder="Details / instructies"></textarea></div></div>
<div class="wizardStep" data-step="2"><div class="fields2"><div class="field"><label>Datum en tijd</label><input type="datetime-local" name="dueLocal"><small id="zoneHint"></small></div><div class="field"><label>Toewijzen aan</label><select name="assigned_to"><option value="">Niet toegewezen</option></select></div><div class="field"><label>Prioriteit</label><select name="priority"><option value="normal">Normaal</option><option value="high">Hoog</option><option value="low">Laag</option></select></div><div class="field"><label>Status</label><select name="status"><option value="open">Open</option><option value="in_progress">Bezig</option><option value="done">Afgerond</option></select></div><div class="field"><label>Vooraf waarschuwen (instelling, nog geen echte push)</label><select name="notify_before_minutes"><option value="0">Op tijdstip</option><option value="5">5 minuten vooraf</option><option value="15">15 minuten vooraf</option><option value="60">1 uur vooraf</option><option value="1440">1 dag vooraf</option></select></div></div></div>
<div class="row between"><button type="button" id="wizardBack" class="btn hidden" data-action="wizard-back">Vorige</button><div style="flex:1"></div><button type="button" id="wizardNext" class="btn primary hidden" data-action="wizard-next">Volgende</button><button id="submitItem" type="submit" class="btn primary">Opslaan</button></div></form></div></dialog>
<script>
(()=>{'use strict';
const C=window.JAR_BUSINESS_CONFIG||{demoMode:true};
const DEMO=C.demoMode!==false, $=s=>document.querySelector(s);
let db=null, user=null, orgs=[], selectedOrg=null, members=[], profiles={}, items=[], events=[], prefs={input_mode:'stacked',locale:'nl-NL',time_zone:'Europe/Amsterdam',auto_refresh_seconds:60,calendar_reminders:true};
let view='overview', search='', statusFilter='all', kindFilter='all', calCursor=new Date(), editItemId=null, wizardStep=0, currentInvite='', poller=null;
const names={overview:'Overzicht',tasks:'Taken',reminders:'Herinneringen',calendar:'Maandagenda',team:'Team',activity:'Activiteit',settings:'Instellingen'};
const symbols={overview:'▦',tasks:'☑',reminders:'◷',calendar:'▦',team:'♙',activity:'◴',settings:'⚙'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.() || 'demo-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const notify=(message,error=false)=>{let t=$('#toast');t.textContent=message;t.className='toast'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.textContent='',4500)};
const tz=()=>prefs.time_zone||'Europe/Amsterdam';
const locale=()=>prefs.locale||'nl-NL';
const dateParts=(date,zone=tz())=>{
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
 return Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
};
const wallDate=(date,zone=tz())=>{let p=dateParts(date,zone);return `${p.year}-${p.month}-${p.day}`};
const wallInput=date=>{if(!date)return'';let p=dateParts(new Date(date));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`};
const formatTime=date=>date?new Intl.DateTimeFormat(locale(),{timeZone:tz(),day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(date)):'Geen datum';
function localToUtc(value,zone=tz()){
 if(!value)return null;
 let m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)$/.exec(value);if(!m)throw Error('Ongeldige datum of tijd');
 let [,Y,M,D,h,mi]=m.map(Number),wall=Date.UTC(Y,M-1,D,h,mi),instant=wall;
 for(let i=0;i<5;i++){
  let p=dateParts(new Date(instant),zone);
  let asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);
  let next=instant+wall-asUTC;if(next===instant)break;instant=next;
 }
 let check=dateParts(new Date(instant),zone);
 if([+check.year,+check.month,+check.day,+check.hour,+check.minute].join(',')!==[Y,M,D,h,mi].join(','))throw Error('Dit tijdstip bestaat niet in de gekozen tijdzone (zomer-/wintertijd)');
 return new Date(instant).toISOString();
}
const currentOrg=()=>orgs.find(o=>o.id===selectedOrg);
const selfRole=()=>members.find(m=>m.user_id===user?.id)?.role||'member';
const manager=()=>['owner','manager'].includes(selfRole());
const owner=()=>selfRole()==='owner';
const memberName=id=>profiles[id]?.display_name|| (id===user?.id?'Ik':'Collega '+String(id||'').slice(0,6));
const isOverdue=i=>i.due_at&&i.status!=='done'&&new Date(i.due_at)<new Date();
const sorted=arr=>[...arr].sort((a,b)=>(a.status==='done')-(b.status==='done')||((a.due_at?Date.parse(a.due_at):Infinity)-(b.due_at?Date.parse(b.due_at):Infinity)));
const todayStr=()=>wallDate(new Date());
const defaultPrefs=()=>({user_id:user.id,...prefs});
function seedDemo(){user={id:'demo-self',email:'demo@justareminder.nl'};orgs=[{id:'demo-org',name:'Demo Bedrijf',billing_status:'not_configured',plan_code:'business_unconfigured'}];selectedOrg='demo-org';members=[{organization_id:selectedOrg,user_id:user.id,role:'owner'},{organization_id:selectedOrg,user_id:'demo-anouk',role:'manager'},{organization_id:selectedOrg,user_id:'demo-raf',role:'member'}];profiles={'demo-self':{display_name:'Demo beheerder'},'demo-anouk':{display_name:'Anouk'},'demo-raf':{display_name:'Raf'}};
let d=n=>new Date(Date.now()+n*86400000).toISOString();items=[{id:'ex1',organization_id:selectedOrg,kind:'task',title:'Offerte controleren',details:'Laatste versie nakijken',status:'open',priority:'high',due_at:d(1),assigned_to:'demo-anouk',created_by:user.id},{id:'ex2',organization_id:selectedOrg,kind:'reminder',title:'Klant bellen',details:'Over contract',status:'open',priority:'normal',due_at:d(2),assigned_to:user.id,created_by:user.id},{id:'ex3',organization_id:selectedOrg,kind:'task',title:'Website testen op mobiel',details:'',status:'in_progress',priority:'normal',due_at:d(4),assigned_to:'demo-raf',created_by:user.id},{id:'ex4',organization_id:selectedOrg,kind:'task',title:'Wekelijkse planning',details:'',status:'done',priority:'low',due_at:d(-2),assigned_to:user.id,created_by:user.id}];events=[{id:1,organization_id:selectedOrg,actor_id:user.id,action:'insert',item_title:'Website testen op mobiel',created_at:new Date().toISOString()}];}
async function init(){
 if(DEMO){seedDemo();render();return}
 if(!C.supabaseUrl||!C.supabaseAnonKey||!window.supabase){$('#root').innerHTML='<main class="auth"><div class="authbox"><h1>Instellen nodig</h1><p>Controleer config.js, je publieke Supabase-sleutel en de internetverbinding.</p></div></main>';return}
 db=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
 const {data:{session}}=await db.auth.getSession(); if(session){user=session.user;await loadAll()}render();
 db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;orgs=[];selectedOrg=null;stopRefresh();render()} });
}
async function getData(query){const r=await query;if(r.error)throw r.error;return r.data}
async function loadAll(){
 if(DEMO)return;
 let mine=await getData(db.from('jar_business_members').select('organization_id,role').eq('user_id',user.id));
 let ids=mine.map(m=>m.organization_id);
 orgs=ids.length?await getData(db.from('jar_business_organizations').select('id,name,plan_code,billing_status,created_by').in('id',ids)):[];
 if(!orgs.some(o=>o.id===selectedOrg))selectedOrg=orgs[0]?.id||null;
 let p=await getData(db.from('jar_business_preferences').select('*').eq('user_id',user.id).maybeSingle());if(p)prefs={...prefs,...p};
 let myP=await getData(db.from('jar_business_profiles').select('*').eq('user_id',user.id).maybeSingle());
 if(!myP){await getData(db.from('jar_business_profiles').insert({user_id:user.id,display_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Collega'}));}
 await loadOrg();startRefresh();
}
async function loadOrg(){if(!selectedOrg){items=[];members=[];events=[];profiles={};return}
 if(DEMO)return;
 const [a,b,c]=await Promise.all([
  getData(db.from('jar_business_members').select('organization_id,user_id,role,joined_at').eq('organization_id',selectedOrg)),
  getData(db.from('jar_business_items').select('*').eq('organization_id',selectedOrg).order('created_at',{ascending:false}).limit(2000)),
  getData(db.from('jar_business_events').select('*').eq('organization_id',selectedOrg).order('created_at',{ascending:false}).limit(100))
 ]);members=a;items=b;events=c;
 let ids=[...new Set(members.map(m=>m.user_id))];let ps=ids.length?await getData(db.from('jar_business_profiles').select('user_id,display_name').in('user_id',ids)):[];
 profiles=Object.fromEntries(ps.map(p=>[p.user_id,p]));
}
function stopRefresh(){if(poller){clearInterval(poller);poller=null}}
function startRefresh(){stopRefresh();if(DEMO||!user)return;poller=setInterval(async()=>{if(document.hidden||!selectedOrg)return;try{await loadOrg();if(!$('#itemDialog').open&&!document.activeElement.closest('form'))render()}catch(e){console.warn('Verversing mislukt',e.message)}},Math.max(30,Number(prefs.auto_refresh_seconds)||60)*1000)}

function modal(kind='task',existing=null,chosenDate=''){editItemId=existing?.id||null;wizardStep=0;$('#itemForm').reset();$('#itemForm').elements.id.value=existing?.id||'';$('#dialogTitle').textContent=existing?'Bewerk item':'Nieuwe taak of herinnering';

function parseSmart(text){let t=String(text||'').trim();if(!t)return null;let remind=/\b(herinner\w*|remind\w*|waarschuw\w*|denk\s+eraan)\b/i.test(t);
let nowZ=dateParts(new Date()),date=new Date(+nowZ.year,+nowZ.month-1,+nowZ.day),year=date.getFullYear(),month=date.getMonth(),day=date.getDate(),hour=9,minute=0,hasDate=false,hasTime=false;
let dmy=t.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{4})\b/),ymd=t.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
if(dmy){day=+dmy[1];month=+dmy[2]-1;year=+dmy[3];hasDate=true}else if(ymd){year=+ymd[1];month=+ymd[2]-1;day=+ymd[3];hasDate=true}else if(/\bovermorgen\b/i.test(t)){date.setDate(date.getDate()+2);hasDate=true}else if(/\bmorgen\b/i.test(t)){date.setDate(date.getDate()+1);hasDate=true}else if(/\bvandaag\b/i.test(t)){hasDate=true}else if(/\bvolgende\s+week\b/i.test(t)){date.setDate(date.getDate()+7);hasDate=true}
if(!dmy&&!ymd){year=date.getFullYear();month=date.getMonth();day=date.getDate()}
let tm=t.match(/\b(?:om\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)\b/);let hr=t.match(/\bom\s+([01]?\d|2[0-3])\s*(?:uur|u)\b/i);
if(tm){hour=+tm[1];minute=+tm[2];hasTime=true}else if(hr){hour=+hr[1];hasTime=true}
let validDate=new Date(year,month,day);let valid=validDate.getFullYear()===year&&validDate.getMonth()===month&&validDate.getDate()===day;
let result={kind:remind?'reminder':'task',title:t.replace(/\b(?:herinner(?:\s+me|ing)?|remind\s+me|waarschuw\s+me)\s*/i,'').replace(/\b(vandaag|overmorgen|morgen|volgende\s+week)\b/ig,'').replace(/\b\d{1,2}[-/]\d{1,2}[-/]\d{4}\b|\b\d{4}-\d{2}-\d{2}\b/g,'').replace(/\bom\s+(?:\d{1,2}(?:(?:[:.]\d{2})|\s*(?:uur|u)))\b/ig,'').replace(/\s+/g,' ').trim(),date:hasDate&&valid?`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`:null};
if(!result.title)result.title=t;if(remind&&!hasDate){result.warning='Dit is een herinnering: vul nog een datum en tijd in.'}if(hasTime&&!hasDate)result.warning='Tijd herkend, maar geen datum. Vul die nog in.';
return result;}

case'rename-org':{if(!owner())throw Error('Alleen eigenaar');let name=prompt('Nieuwe bedrijfsnaam:',currentOrg()?.name);if(!name)return;if(DEMO)currentOrg().name=name;else{await getData(db.rpc('jar_business_rename_organization',{p_org:selectedOrg,p_name:name}));currentOrg().name=name}render();break}
case'smart-parse':{let x=parseSmart($('#smartText').value);if(!x){notify('Voer eerst een zin in',true);return}let f=$('#itemForm').elements;f.kind.value=x.kind;f.title.value=x.title;if(x.date)f.dueLocal.value=x.date;notify(x.warning||'Herkend als '+(x.kind==='task'?'taak':'herinnering'));break}
case'wizard-back':wizardStep=Math.max(0,wizardStep-1);updateWizard();break;case'wizard-next':{let f=$('#itemForm').elements;if(wizardStep===1&&!f.title.value.trim()){notify('Vul een titel in',true);return}wizardStep=Math.min(2,wizardStep+1);updateWizard();break}
case'create-invite':{if(!manager())throw Error('Geen toestemming');let role=$('#inviteRole').value;if(DEMO)currentInvite='DEMO-GEEN-GELDIGE-CODE';else currentInvite=await getData(db.rpc('jar_business_create_invite',{p_org:selectedOrg,p_role:role}));render();notify('Eenmalige code aangemaakt');break}
case'copy-invite':if(!currentInvite)return;await navigator.clipboard.writeText(currentInvite);notify('Code gekopieerd');break;
case'remove-member':{if(!confirm('Deze collega uit het bedrijf verwijderen?'))return;let role=members.find(m=>m.user_id===id)?.role;if(role==='owner'||(!owner()&&role==='manager'))throw Error('Geen toestemming');if(DEMO){members=members.filter(m=>m.user_id!==id);items.forEach(i=>{if(i.assigned_to===id)i.assigned_to=null})}else{await getData(db.rpc('jar_business_remove_member',{p_org:selectedOrg,p_member_user:id}));await loadOrg()}render();break}
}}catch(err){console.error(err);notify(err.message||'Er ging iets mis',true)}}
async function handleChange(e){let t=e.target;try{if(t.id==='orgSelect'){selectedOrg=t.value||null;currentInvite='';await loadOrg();view='overview';render()}
else if(t.id==='statusFilter'){statusFilter=t.value;render()}
else if(t.matches('[data-role-user]')){let id=t.dataset.roleUser;if(!confirm('Rol van deze collega wijzigen?')){render();return}if(!owner())throw Error('Alleen eigenaar');if(DEMO)members.find(x=>x.user_id===id).role=t.value;else{await getData(db.rpc('jar_business_set_member_role',{p_org:selectedOrg,p_member_user:id,p_role:t.value}));await loadOrg()}render();notify('Rol gewijzigd')}
}catch(err){notify(err.message||'Fout',true);render()}}
async function handleSubmit(e){let formId=e.target.getAttribute('id');if(!['itemForm','authForm','settingsForm'].includes(formId))return;e.preventDefault();try{
if(formId==='itemForm'){await saveItem(e)}else if(formId==='authForm'){
 let email=e.target.elements.email.value,password=e.target.elements.password.value,intent=e.submitter?.value||'login';let res=intent==='register'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(res.error)throw res.error;if(res.data.session){user=res.data.user;await loadAll();render();notify('Ingelogd')}else notify('Controleer je e-mail voor de bevestigingslink')
}else if(formId==='settingsForm'){
 let f=e.target.elements;let update={input_mode:f.input_mode.value,locale:f.locale.value,time_zone:f.time_zone.value,auto_refresh_seconds:+f.auto_refresh_seconds.value,calendar_reminders:f.calendar_reminders.checked};let display=f.display_name.value.trim();if(!display)throw Error('Vul een weergavenaam in');prefs={...prefs,...update};profiles[user.id]={user_id:user.id,display_name:display};
 if(!DEMO){await getData(db.from('jar_business_preferences').upsert({user_id:user.id,...update}));await getData(db.from('jar_business_profiles').upsert({user_id:user.id,display_name:display}))}startRefresh();render();notify('Voorkeuren opgeslagen')
}}catch(err){console.error(err);notify(err.message||'Kan niet opslaan',true)}}
let gesture=null;document.addEventListener('touchstart',e=>{if(prefs.input_mode!=='swipe'||!$('#itemDialog').open||!e.target.closest('.wizardStep')||e.target.closest('input,textarea,select,button'))return;gesture={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!gesture)return;let dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;gesture=null;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.5)return;if(dx<0){if(wizardStep===1&&!$('#itemForm').elements.title.value.trim()){notify('Vul eerst een titel in',true);return}wizardStep=Math.min(2,wizardStep+1)}else wizardStep=Math.max(0,wizardStep-1);updateWizard()},{passive:true});
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('submit',handleSubmit);
document.addEventListener('input',e=>{if(e.target.id==='search'){let val=e.target.value;let pos=e.target.selectionStart;search=val;let active=document.activeElement;render();let el=$('#search');el.focus();el.setSelectionRange(pos,pos)}});
init().catch(err=>{console.error(err);notify(err.message||'Opstarten mislukt',true);$('#root').innerHTML='<main class="auth"><div class="authbox"><h2>Opstartfout</h2><p>Controleer de console en Supabase-configuratie.</p></div></main>'});
})();
</script>
</body></html>
